<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=\, initial-scale=1.0">
    <title>CSS Selector Demostration</title>
    <link rel="stylesheet" href="CSSTASK2.css">

</head>
<body>
    <h1>CSS Selector Demostration</h1>
    <div>
        <h2>First Division</h2>
        This div uses the common element selector.
    </div>
    <div class="Second">
        <h2>Second Division</h2>
        <p>This div uses a class selector.</p>
        <p>Can be Used for multiple element selection.</p>
    </div>
    <div id="Third">
        <h2>Third Division</h2>
        <p>This Div uses and ID selector.</p>
        <p>Mostly used for Unique element selection.</p>
    </div>
    
</body>
</html>
